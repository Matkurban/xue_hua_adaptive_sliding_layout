version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  jaspr: ^0.24.0-beta.0
  jaspr_router: ^0.10.0-beta.0
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.1
  build_web_compilers: ^4.8.12
  jaspr_builder: ^0.24.0-beta.0
  jaspr_lints: ^0.8.0-beta.0
  lints: ^6.1.0

jaspr:
  mode: static
