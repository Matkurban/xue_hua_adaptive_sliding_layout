include: package:lints/recommended.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - lib/**.options.dart

plugins:
  jaspr_lints:
    version: ^0.8.0-beta.0
    diagnostics:
      sort_children_last: true
      prefer_html_components: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - always_declare_return_types
