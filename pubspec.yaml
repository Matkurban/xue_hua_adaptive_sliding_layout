name: xue_hua_adaptive_sliding_layout
description: Declarative adaptive routing for Flutter. One route table maps a URL to a page stack and a 1- or 2-column sliding layout. Navigator-named APIs.
version: 3.3.1
repository: https://github.com/Matkurban/xue_hua_adaptive_sliding_layout
homepage: https://matkurban.github.io/xue_hua_adaptive_sliding_layout/

topics:
  - flutter
  - navigation
  - routing
  - layout
  - adaptive-layout

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  signals_flutter: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
