name: xue_hua_adaptive_sliding_layout
description: Declarative adaptive routing for Flutter. One route table maps a URL to a page stack and a 1- or 2-column sliding layout. Navigator-named APIs, no go_router.
version: 3.1.2
repository: https://github.com/Matkurban/xue_hua_adaptive_sliding_layout
homepage: https://matkurban.github.io/xue_hua_adaptive_sliding_layout/

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.3.0
  signals_flutter: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
