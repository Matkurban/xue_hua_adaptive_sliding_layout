name: Deploy web demo & docs

# Runs only when the package version changes (push to main that edits
# pubspec.yaml AND changes its `version:` line) or when started by hand.
# Tags are deliberately not a trigger: the release flow pushes the version
# commit and its tag together, so one mechanism avoids double runs, and the
# github-pages environment only allows deployments from main.
on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Minimal gate: no checkout, two raw file reads, a few seconds.
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ver() { curl -fsSL "https://raw.githubusercontent.com/$REPO/$1/pubspec.yaml" | grep -m1 '^version:' || true; }
          old="$(ver "$BEFORE")"; new="$(ver "$SHA")"
          echo "before: $old"; echo "after:  $new"
          if [ -n "$new" ] && [ "$old" = "$new" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Package analyze
        run: |
          flutter pub get
          flutter analyze
      - name: Example analyze
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Build web demo
        working-directory: example
        run: flutter build web --release --base-href /xue_hua_adaptive_sliding_layout/example/
      # Jaspr documentation site -> /xue_hua_adaptive_sliding_layout/docs/
      - name: Docs analyze
        working-directory: docs_site
        run: |
          dart pub get
          dart analyze
      - name: Build docs
        working-directory: docs_site
        run: |
          dart pub global activate jaspr_cli 0.23.5
          dart pub global run jaspr_cli:jaspr build --dart-define=SITE_BASE=/xue_hua_adaptive_sliding_layout/docs
      # Pages layout: /example/ (Flutter), /docs/ (Jaspr), / -> redirect to /docs/
      - name: Assemble Pages artifact
        run: |
          rm -rf _site docs_site/build/jaspr/packages docs_site/build/jaspr/.dart_tool docs_site/build/jaspr/.build.manifest
          mkdir -p _site/example _site/docs
          cp -R example/build/web/. _site/example/
          cp -R docs_site/build/jaspr/. _site/docs/
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>xue_hua_adaptive_sliding_layout</title>
            <meta http-equiv="refresh" content="0; url=docs/">
            <link rel="canonical" href="https://matkurban.github.io/xue_hua_adaptive_sliding_layout/docs/">
            <!-- Old demo deep links (/#/route) go to the demo, everything else to the docs. -->
            <script>location.replace((location.hash ? 'example/' : 'docs/') + location.hash);</script>
          </head>
          <body><a href="docs/">Documentation</a> · <a href="example/">Live demo</a></body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
